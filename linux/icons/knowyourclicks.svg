<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="208" height="208" rx="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Keyboard Body Frame -->
  <rect x="44" y="58" width="168" height="124" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Row 1 Keys -->
  <rect x="56" y="70" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="84" y="70" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="112" y="70" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="140" y="70" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="168" y="70" width="32" height="18" rx="4" fill="#ef4444" fill-opacity="0.8" stroke="#f87171" stroke-width="1.5"/>

  <!-- Row 2 Keys -->
  <rect x="56" y="96" width="26" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="88" y="96" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="116" y="96" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="144" y="96" width="22" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="172" y="96" width="28" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 3 Keys (Punctuation Highlights) -->
  <rect x="56" y="122" width="30" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="92" y="122" width="22" height="18" rx="4" fill="#4ade80" fill-opacity="0.25" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="120" y="122" width="22" height="18" rx="4" fill="#4ade80" fill-opacity="0.25" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="148" y="122" width="22" height="18" rx="4" fill="#4ade80" fill-opacity="0.25" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="176" y="122" width="24" height="18" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 4: HERO Spacebar Key with Glowing Cyan Accent -->
  <rect x="76" y="148" width="104" height="22" rx="6" fill="url(#accentGrad)" filter="url(#glow)"/>
  <rect x="76" y="148" width="104" height="22" rx="6" fill="url(#accentGrad)" stroke="#e0f2fe" stroke-width="1.5"/>

  <!-- Speed Needle / Pulse Symbol -->
  <path d="M 128 152 L 128 166" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Analytics / Speedometer arc under keyboard -->
  <path d="M 60 206 C 90 190, 166 190, 196 206" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
  <circle cx="128" cy="192" r="4" fill="#4ade80" filter="url(#glow)"/>
  <text x="128" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">KNOWYOURCLICKS</text>
</svg>
